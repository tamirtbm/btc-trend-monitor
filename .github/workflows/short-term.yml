name: BTC Short-Term Trend Check

on:
  # הטריגר העיקרי הוא שירות cron חיצוני שקורא ל-workflow_dispatch כל 5 דקות
  # (ה-schedule המובנה של GitHub התעכב בפועל בשעות, ראו PR שהוסיף את זה).
  # ה-schedule כאן הוא רק גיבוי שעתי למקרה שהשירות החיצוני נופל.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run short-term check
        env:
          CRYPTO_TELEGRAM_BOT_TOKEN: ${{ secrets.CRYPTO_TELEGRAM_BOT_TOKEN }}
          CRYPTO_TELEGRAM_CHAT_ID: ${{ secrets.CRYPTO_TELEGRAM_CHAT_ID }}
        run: |
          for symbol in BTCUSDT SOLUSDT ETHUSDT ENAUSDT; do
            python btc_trend_monitor.py short "$symbol"
          done

      - name: Commit updated state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update state [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) - another run likely pushed first. Rebasing and retrying..."
            git pull --rebase origin main
          done
          echo "Failed to push after 5 attempts" >&2
          exit 1
